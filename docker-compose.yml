version: "3.9"

services:
  postgres:
    image: postgres:14-alpine
    container_name: vt-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: veendibazaar_customer_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: darga@786


    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d veendibazaar_customer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: mydb
    volumes:
      - mongo_data:/data/db




volumes:
  postgres_data:
  mongo_data:
